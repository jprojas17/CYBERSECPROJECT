{% extends "base.html" %}

{% block title %}Login to your account{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="auth-card">
        <div class="auth-header">
            <h2>Login to your account</h2>
            <p>Enter your master credentials below to access your vault</p>
        </div>

        <form method="POST" action="{{ url_for('login') }}" class="auth-form">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" class="form-input" required autofocus placeholder="m@example.com">
            </div>

            <div class="form-group">
                <div class="label-row">
                    <label for="master_password">Master Password</label>
                </div>
                <input type="password" id="master_password" name="master_password" class="form-input" required placeholder="••••••••••••">
            </div>

            <button type="submit" class="btn btn-primary btn-block">Login</button>
        </form>

        <div class="auth-footer">
            <p>Don't have an account? <a href="{{ url_for('register') }}">Sign up</a></p>
        </div>
    </div>
</div>
{% endblock %}
