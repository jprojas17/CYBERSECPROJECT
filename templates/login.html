{% extends "base.html" %}

{% block title %}Sign In{% endblock %}

{% block content %}
<div class="auth-wrapper">
    <div class="card auth-card">
        <div class="card-header">
            <h2 class="card-title">🔐 Master Key Access</h2>
            <p class="card-subtitle">Authenticate with your Zero-Knowledge credentials</p>
        </div>

        <form action="{{ url_for('login') }}" method="POST" class="form-body">
            <input type="hidden" name="csrf_token" value="{{ csrf_token }}">

            <div class="form-group">
                <label for="username" class="form-label">Username</label>
                <input type="text" id="username" name="username" class="form-input" required autofocus placeholder="Enter your username" autocomplete="username">
            </div>

            <div class="form-group">
                <label for="master_password" class="form-label">Master Password</label>
                <input type="password" id="master_password" name="master_password" class="form-input" required placeholder="••••••••••••••••" autocomplete="current-password">
            </div>

            <button type="submit" class="btn btn-primary btn-block" {% if locked %}disabled{% endif %}>
                Unlock Vault
            </button>
        </form>

        <div class="auth-footer">
            <p>New user? <a href="{{ url_for('register') }}" class="link">Create a secure vault</a></p>
        </div>
    </div>
</div>
{% endblock %}
